<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper or Scissors game</title>
    <link rel="icon" type="image/png" href="./images/GP-logo.png">
    
    <meta property="og:title" content="Gabriel Perencine | Rock Paper Scissors">
    <meta property="og:description" content="A personal landing page built as part of The Odin Project Foundations course, demonstrating HTML and CSS fundamentals.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gperencine.github.io/Odin-Rock-Paper-Scissors/">
    <meta property="og:image" content="https://gperencine.github.io/Odin-Rock-Paper-Scissors/images/GP-logo.png">
    <meta property="og:site_name" content="Gabriel Perencine">

    <meta name="description" content="Personal landing page developed as part of The Odin Project Foundations course using HTML and CSS.">
    <meta name="author" content="Gabriel Perencine">

    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>
    <main>
        <section id="matchScore">
            <div id="playerScore">
                <h2>Player:</h2> 
                <h2 id="playerScoreText">0</h2>
            </div>
            <div id="separator">
                <h2>X</h2>
            </div>
            <div id="computerScore">
                <h2>Computer:</h2> 
                <h2 id="computerScoreText">0</h2> 
            </div>
        </section>
        <section id="controls">
            <p>Escolha:</p>
            <div id="buttons">
                <button id="rock">Rock</button>
                <button id="paper">Paper</button>
                <button id="scissors">Scissors</button>
            </div>
        </section>
        <section id="choices">
            <div id="playerChoice">
                <h3>Player:</h3> 
                <h3 id="playerChoiceText">-</h3>
            </div>
            <div id="computerChoice">
                <h3>Computer:</h3>
                <h3 id="computerChoiceText">-</h3>
            </div>
        </section>
    </main>
    <footer>
        <p>Copyright &copy <a href="https://github.com/GPerencine/Odin-Rock-Paper-Scissors" target="_blank">Gabriel Perencine <img src="images/github.svg" alt="GitHub Logo" title="GitHub"></a></p>
    </footer>

</body>
</html>
